<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环保排放标准速查</title>
<style>
:root{
  --ink:#15181c; --ink2:#4b525a; --ink3:#8b939c; --ink4:#aab1b9;
  --line:#e7eaee; --line2:#f1f4f7;
  --bg:#fbfcfd; --card:#fff;
  --gr:#0b5a35; --gr2:#0f9d58; --gr-soft:#e6f2ec; --gr-line:#b3d1c1;
  --am:#8a6a1f; --am-soft:#f7f2e6; --am-line:#e8dcc0;
  --bl:#2a5f8f; --bl-soft:#eaf1f8;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased;
font-variant-numeric:tabular-nums}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}

/* ---------- 顶部 ---------- */
.hero{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);
backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;padding:18px 0 15px}
.logo{width:40px;height:40px;border-radius:11px;flex:none;background:#fff;
display:flex;align-items:center;justify-content:center;
border:1px solid var(--gr-line);box-shadow:0 1px 6px rgba(20,60,40,.11)}
.logo img{width:27px;height:27px;display:block}
.bt{font-size:22.5px;font-weight:800;letter-spacing:.8px;line-height:1.22;color:var(--ink)}
.sub{font-size:12px;color:var(--ink3);letter-spacing:.6px;margin-top:3px}
.by{margin-left:auto;font-size:11.5px;color:var(--gr);letter-spacing:.6px;
padding:5px 13px;border-radius:20px;background:var(--gr-soft);
border:1px solid var(--gr-line);white-space:nowrap;line-height:1.4;flex:none}
.by b{display:block;font-size:12.5px;color:var(--gr);font-weight:800;letter-spacing:.4px}

.sbox{position:relative;margin:2px 0 13px}
.sbox svg.ci{position:absolute;left:19px;top:50%;transform:translateY(-50%);
width:20px;height:20px;color:var(--gr);pointer-events:none}
#q{width:100%;font-size:18px;font-weight:500;font-family:inherit;color:var(--ink);
padding:17px 48px 17px 50px;border:2px solid var(--gr);border-radius:15px;
background:#fff;outline:none;transition:border-color .16s,box-shadow .16s;
-webkit-appearance:none;appearance:none;
box-shadow:0 4px 16px rgba(11,90,53,.11)}
#q::placeholder{color:#9aa3ac;font-size:15.5px;font-weight:400}
#q:focus{border-color:var(--gr);box-shadow:0 0 0 5px rgba(11,90,53,.13),0 7px 22px rgba(11,90,53,.16)}
#clr{position:absolute;right:13px;top:50%;transform:translateY(-50%);display:none;
width:28px;height:28px;border:0;border-radius:50%;background:#e4eaee;color:var(--ink2);
font-size:16px;line-height:1;cursor:pointer}
#clr.on{display:block}
.row{display:flex;gap:7px;align-items:center;padding-bottom:13px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:6px 15px;border:1px solid #d3dae0;border-radius:20px;
background:#fff;color:var(--ink2);font-weight:500;cursor:pointer;user-select:none;
transition:.15s;letter-spacing:.2px}
.chip:hover{border-color:var(--gr-line);color:var(--gr);background:var(--gr-soft)}
.chip.on{background:var(--gr);border-color:var(--gr);color:#fff;font-weight:600}
.cnt{margin-left:auto;font-size:12px;color:var(--ink3);letter-spacing:.2px;white-space:nowrap}
.cnt b{color:var(--ink2);font-weight:600}

/* ---------- 正文 ---------- */
main{padding:20px 0 10px;min-height:60vh}
.tip{display:flex;gap:9px;font-size:12px;color:var(--ink3);line-height:1.65;
padding:12px 2px 0;margin-top:12px;border-top:1px dashed var(--line)}
.tip i{flex:none;width:2px;background:var(--gr-line);border-radius:2px;align-self:stretch}
.tip b{color:var(--ink2);font-weight:500}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
margin-bottom:9px;overflow:hidden;transition:border-color .16s,box-shadow .16s}
.card:hover{border-color:#d8dee4}
.card.open{border-color:var(--gr-line);box-shadow:0 3px 18px rgba(20,40,32,.055)}
.hd{padding:13px 17px;cursor:pointer;display:flex;align-items:center;gap:11px;
-webkit-tap-highlight-color:transparent}
.no{font-size:12px;font-weight:650;color:var(--gr);letter-spacing:.2px;
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
background:var(--gr-soft);padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.nm{font-size:14.5px;font-weight:500;flex:1;min-width:0;letter-spacing:.1px}
.tags{display:flex;gap:5px;flex:none}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.2px;
font-weight:500}
.tag.w{background:var(--bl-soft);color:var(--bl)}
.tag.g{background:var(--gr-soft);color:var(--gr)}
.tag.o{background:var(--am-soft);color:var(--am)}
.arw{flex:none;width:13px;height:13px;color:var(--ink4);transition:transform .18s}
.card.open .arw{transform:rotate(90deg);color:var(--gr)}
.bd{display:none}
.card.open .bd{display:block}

.meta{padding:11px 17px;font-size:12px;color:var(--ink3);background:#fcfdfd;
border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);letter-spacing:.1px}
.meta b{color:var(--ink2);font-weight:500}
.meta span.sp{color:#d5dae0;margin:0 7px}
.box{margin:12px 17px 0;padding:9px 13px;border-radius:9px;font-size:12.5px;
line-height:1.62;border-left:2px solid}
.box b{font-weight:600}
.box.cond{background:var(--gr-soft);border-color:var(--gr);color:#124f34}
.box.also{background:var(--am-soft);border-color:#c9a94a;color:#6d5418}
.box.note{background:#f6f8fa;border-color:#c8cfd6;color:var(--ink2);font-size:12px}

.tbl{padding:14px 0 2px}
.tt{font-size:12.5px;font-weight:600;color:var(--ink2);padding:0 17px 7px;
display:flex;align-items:center;gap:8px;letter-spacing:.1px}
.flag{font-weight:500;font-size:10.5px;color:var(--am);background:var(--am-soft);
border:1px solid var(--am-line);border-radius:4px;padding:0 6px;letter-spacing:.2px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{background:#fcfdfd;color:var(--ink3);font-weight:500;font-size:11.5px;letter-spacing:.3px;
text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f5f7f9;color:#2c323a;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#fdfefe}
td.n{font-weight:600;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
tr.hit td{background:var(--gr-soft)}
tr.hit td:first-child{box-shadow:inset 2px 0 0 var(--gr)}

.foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
padding:11px 17px 14px;font-size:12px;color:var(--ink3)}
.foot a{margin-left:auto;color:var(--gr);text-decoration:none;font-size:12.5px;
padding:5px 13px;border:1px solid var(--gr-line);border-radius:20px;
background:#fff;transition:.15s;white-space:nowrap}
.foot a:hover{background:var(--gr);color:#fff;border-color:var(--gr)}

.empty{text-align:center;padding:64px 20px;color:var(--ink3)}
.empty .e1{font-size:14.5px;color:var(--ink2);margin-bottom:6px}
.empty .e2{font-size:12.5px}

/* ---------- 页脚 ---------- */
footer{margin-top:26px;border-top:1px solid var(--line);background:#fff;padding:22px 0 28px}
.fb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fb .f1{font-size:13.5px;font-weight:600;letter-spacing:.3px}
.fb .f2{font-size:12px;color:var(--gr);letter-spacing:.5px}
.fn{font-size:11.5px;color:var(--ink3);line-height:1.8;max-width:760px}
.fn b{color:var(--ink2);font-weight:500}
.icp{margin-top:9px;font-size:11.5px;color:var(--ink4);letter-spacing:.2px}
.icp a{color:var(--ink4);text-decoration:none}
.icp a:hover{color:var(--gr)}

/* ---------- 精选提示 ---------- */
.feat{font-size:12.5px;color:var(--ink3);letter-spacing:.2px;margin-bottom:13px}
.feat b{color:var(--ink2);font-weight:600}
.moreall{display:block;margin:16px auto 4px;font-size:13px;color:var(--gr);
background:#fff;border:1px dashed var(--gr-line);border-radius:22px;
padding:9px 26px;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:.15s}
.moreall:hover{background:var(--gr-soft);border-style:solid}

#top{position:fixed;right:18px;bottom:22px;width:38px;height:38px;border-radius:50%;
border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--ink2);
cursor:pointer;display:none;align-items:center;justify-content:center;
box-shadow:0 2px 10px rgba(20,30,40,.09);backdrop-filter:blur(8px);z-index:40}
#top.on{display:flex}
#top svg{width:15px;height:15px}

@media(max-width:640px){
  .wrap{padding:0 13px}
  .by{display:none}
  .brand{gap:11px;padding:15px 0 13px}
  .logo{width:36px;height:36px;border-radius:10px}
  .logo img{width:24px;height:24px}
  .bt{font-size:18.5px;letter-spacing:.3px}
  .sub{font-size:11.5px}
  #q{font-size:16.5px;padding:15px 46px 15px 46px;border-radius:13px}
  .sbox svg.ci{left:17px;width:18px;height:18px}
  .nm{font-size:13.5px;line-height:1.45}
  .hd{padding:12px 14px;gap:9px;flex-wrap:wrap}
  .tags{order:3;width:100%}
  .meta,.foot{padding-left:14px;padding-right:14px}
  .tt{padding-left:14px;padding-right:14px}
  .box{margin-left:14px;margin-right:14px}
  table{font-size:12.5px;min-width:480px}
  th,td{padding:7px 9px}
}
</style>
</head>

30204574193333905.pdf","note":"暂未提取到限值表（扫描件或格式特殊），可点官方链接看全文","tables":[]}]};
let mode='all',kw='',allShown=false;
const DEF_SHOW=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MED={'水':'w','气':'g','固废':'o'};
const TOT=D.standards.reduce((a,s)=>a+(s.tables||[]).reduce((b,t)=>b+t.rows.length,0),0);
// 按当前介质统计限值与标准数，避免切介质后仍显示全库数字
const inMode=s=>mode==='all'||(s.介质||'').includes(mode);
const TOT_M=()=>D.standards.filter(inMode).reduce((a,s)=>a+(s.tables||[]).reduce((b,t)=>b+t.rows.length,0),0);
// 默认精选：水/气/固废各一项常见标准，输入关键词或点"查看全部"后展示全库
const FEATURED=['GB8978-1996','GB16297-1996','GB18598'];
const featHit=s=>FEATURED.some(f=>s.std_id.replace(/\s/g,'').toUpperCase().startsWith(f));

const isNum=c=>{const s=String(c==null?'':c).trim();
  return !!s && s.length<=18 && /\d/.test(s) && !/[\u4e00-\u9fa5]/.test(s) && !/^(GB|HJ|DB)/i.test(s);};

function stdHit(s,t){return [s.编号,s.名称,s.行业,s.std_id,s.介质].join(' ').toLowerCase().includes(t);}
function rowHit(tb,t){const h=[];tb.rows.forEach((r,ri)=>{
  if(r.some(c=>String(c==null?'':c).toLowerCase().includes(t)))h.push(ri);});return h;}
function search(s,t){
  if(mode!=='all'&&!(s.介质||'').includes(mode))return null;
  if(!t)return {std:true,rows:{}};
  if(stdHit(s,t))return {std:true,rows:{}};
  const rows={};
  (s.tables||[]).forEach((tb,i)=>{const h=rowHit(tb,t);if(h.length)rows[i]=h;});
  return Object.keys(rows).length?{std:false,rows}:null;
}

function render(){
  const t=kw.toLowerCase();
  const featured=!kw&&!allShown;           // 默认只展示前10条
  let list=D.standards.map(s=>({s,res:search(s,t)})).filter(x=>x.res);
  if(featured){
    list=list.slice(0,DEF_SHOW);
  }
  const nAll=D.standards.filter(s=>mode==='all'||(s.介质||'').includes(mode)).length;
  const tot=TOT_M();
  $('#cnt').innerHTML = kw ? '匹配 <b>'+list.length+'</b> 项标准'
    : (featured ? '默认展示 <b>'+list.length+'</b> 项 · 全库 <b>'+nAll+'</b> 项 · <b>'+tot+'</b> 条限值'
                : '共 <b>'+list.length+'</b> 项标准 · <b>'+tot+'</b> 条限值');
  $('#clr').classList.toggle('on', !!kw);
  if(!list.length){
    $('#list').innerHTML='<div class="empty"><div class="e1">没有匹配的标准</div>'+
      '<div class="e2">换个标准号或行业名称再试</div></div>';return;}
  $('#list').innerHTML=list.map(({s,res})=>{
    const med=(s.介质||'').split('/').map(m=>'<span class="tag '+(MED[m]||'')+'">'+esc(m)+'</span>').join('');
    let body='';
    const m1=[];
    if(s.实施)m1.push('<b>实施</b> '+esc(s.实施));
    if(s.代替&&s.代替!=='—')m1.push('<b>代替</b> '+esc(s.代替));
    if(s.行业)m1.push('<b>行业</b> '+esc(s.行业));
    if(m1.length)body+='<div class="meta">'+m1.join('<span class="sp">/</span>')+'</div>';
    if(s.适用)body+='<div class="box cond"><b>适用条件：</b>'+esc(s.适用)+'</div>';
    if(s.同时适用)body+='<div class="box also"><b>可能同时适用：</b>'+esc(s.同时适用)+'</div>';
    if(s.note)body+='<div class="box note">'+esc(s.note)+'</div>';
    const n=(s.tables||[]).length;
    (s.tables||[]).forEach((tb,i)=>{
      let rows=tb.rows,highlight=null;
      if(res.rows[i]!==undefined&&!res.std){
        highlight=new Set(res.rows[i]);
        if(kw)rows=tb.rows.filter((r,ri)=>highlight.has(ri));
      }
      if(!rows.length)return;
      body+='<div class="tbl"><div class="tt">'+esc(tb.title)+
        (tb.flag?'<span class="flag" title="结构存疑，数值需人工核对">待复核 · '+esc(tb.flag)+'</span>':'')+
        '</div><div class="tblwrap"><table><thead><tr>'+
        tb.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>{
          const hit=highlight&&highlight.has(tb.rows.indexOf(r));
          return '<tr'+(hit?' class="hit"':'')+'>'+r.map(c=>
            '<td'+(isNum(c)?' class="n"':'')+'>'+esc(c)+'</td>').join('')+'</tr>';
        }).join('')+'</tbody></table></div></div>';
    });
    if(!n)body+='<div class="box note">本标准限值数据整理中，可点击下方链接查看官方全文。</div>';
    const cnt=(s.tables||[]).reduce((a,t)=>a+t.rows.length,0);
    body+='<div class="foot"><span>'+(cnt?'共 '+cnt+' 条限值 · '+n+' 张表':'暂无限值数据')+'</span>'+
      '<a href="'+esc(s.链接||'#')+'" target="_blank" rel="noopener">查看标准全文</a></div>';
    return '<div class="card"><div class="hd">'+
      '<span class="no">'+esc(s.编号)+'</span><span class="nm">'+esc(s.名称)+'</span>'+
      '<span class="tags">'+med+'</span>'+
      '<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '+
      'stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'+
      '</div><div class="bd">'+body+'</div></div>';
  }).join('');
  if(featured)$('#list').innerHTML+=
    '<button class="moreall" id="moreall">查看全部 '+nAll+' 项标准 →</button>';
  if(kw)document.querySelectorAll('.card').forEach(c=>c.classList.add('open'));
}
$('#list').addEventListener('click',e=>{
  if(e.target.closest('#moreall')){allShown=true;render();return;}
  const hd=e.target.closest('.hd');
  if(hd)hd.parentElement.classList.toggle('open');
});
$('#q').oninput=e=>{kw=e.target.value.trim();render()};
$('#clr').onclick=()=>{$('#q').value='';kw='';render();$('#q').focus()};
document.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');mode=c.dataset.m;render()});
window.addEventListener('scroll',()=>{
  $('#top').classList.toggle('on',window.scrollY>420)});
$('#top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}});
render();
</script>
</body></html>
