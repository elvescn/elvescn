<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>万能二维码生成器</title>
<style>
    body {
        margin: 0;
        background: #e5e5e5;
        font-family: "Microsoft YaHei", Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 0;
    }
    .container {
        width: 900px;
        background: #f7f7f7;
        border-radius: 14px;
        padding: 35px;
        box-shadow: 0 6px 30px rgba(0,0,0,0.15);
    }
    h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 30px;
    }
    textarea {
        width: 100%;
        height: 120px;
        font-size: 20px;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        resize: vertical;
    }
    .options {
        margin: 25px 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .option-group label {
        font-size: 18px;
        display: block;
        margin-bottom: 8px;
    }
    .option-group input[type="color"] {
        width: 80px;
        height: 40px;
        border: none;
    }
    .option-group button {
        font-size: 18px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #333;
        color: #fff;
        cursor: pointer;
    }
    .preview {
        text-align: center;
        margin-top: 30px;
    }
    canvas {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>📱 万能二维码生成器</h1>

    <textarea id="textInput" placeholder="输入文本、电话、短信、邮箱、网址..."></textarea>

    <div class="options">
        <div class="option-group">
            <label>前景色</label>
            <input type="color" id="colorPicker" value="#000000">
            <br><br>
            <button onclick="randomColor()">随机颜色</button>
        </div>
        <div class="option-group">
            <label>中心图片（Logo）</label>
            <input type="file" id="logoInput" accept="image/*">
        </div>
    </div>

    <div class="preview">
        <canvas id="canvas" width="440" height="440"></canvas>
    </div>
</div>

<!-- qrcode-generator（轻量、稳定） -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('textInput');
const colorPicker = document.getElementById('colorPicker');
const logoInput = document.getElementById('logoInput');

let logoImage = null;

function randomColor() {
    const color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
    colorPicker.value = color;
    drawQR();
}

function drawQR() {
    const text = textInput.value.trim();
    if (!text) {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        return;
    }

    const qr = qrcode(0, 'H');
    qr.addData(text);
    qr.make();

    const cellSize = 400 / qr.getModuleCount();
    const offset = (440 - 400) / 2;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = colorPicker.value;
    for (let row = 0; row < qr.getModuleCount(); row++) {
        for (let col = 0; col < qr.getModuleCount(); col++) {
            if (qr.isDark(row, col)) {
                ctx.fillRect(
                    offset + col * cellSize,
                    offset + row * cellSize,
                    cellSize,
                    cellSize
                );
            }
        }
    }

    if (logoImage) {
        const size = 70;
        const x = (canvas.width - size) / 2;
        const y = (canvas.height - size) / 2;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x-5, y-5, size+10, size+10);

        ctx.drawImage(logoImage, x, y, size, size);
    }
}

textInput.addEventListener('input', drawQR);
colorPicker.addEventListener('input', drawQR);

logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        logoImage = new Image();
        logoImage.onload = drawQR;
        logoImage.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

drawQR();
</script>

</body>
</html>
